services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    volumes:
      - ./alembic:/app/alembic
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  fastapi:
    container_name: api
    build: ./backend
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - fastapi

volumes:
  postgres_data:
